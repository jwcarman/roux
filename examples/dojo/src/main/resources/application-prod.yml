# Production: run with SPRING_PROFILES_ACTIVE=prod and set every variable below. None has a default,
# so a missing one fails startup instead of falling back to a development value.
#
# The database comes from Spring Boot's own variables: SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
app:
  # The public origin, https and no trailing slash, such as https://app.example.com.
  base-url: ${APP_BASE_URL}
  owner-email: ${APP_OWNER_EMAIL}
  owner-name: ${APP_OWNER_NAME}

spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

who:
  email-link:
    # Links go to ${app.base-url}/signin/link (application.yml).
    from: ${MAIL_FROM}
    # Keys the typed sign-in codes. At least 32 characters: openssl rand -base64 32
    code-secret: ${WHO_CODE_SECRET}
  passkey:
    # The app's own host, such as app.example.com. It is not derived from app.base-url, and it
    # must not be a domain that other apps share. allowed-origins stays ${app.base-url}.
    rp-id: ${PASSKEY_RP_ID}
    from: ${MAIL_FROM}
# The session cookie is Secure, HttpOnly and SameSite=Lax by default (application.yml).
