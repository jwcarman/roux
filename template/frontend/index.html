<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__APP_NAME__</title>
    <!-- The owner's theme, written by the server (roux, which serves the shell); the app builds its look from it. -->
    <script type="application/json" id="app-theme">__APP_THEME__</script>
    <script type="application/json" id="app-context">__APP_CONTEXT__</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Light or dark mode before the first paint, as next-themes keeps it ("theme" in localStorage;
      // absent or "system" follows the system's). React-added scripts never run, so this must be here.
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var dark =
            theme === "dark" ||
            ((theme === null || theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          // No storage (a locked-down browser): next-themes sets the mode once the app starts.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
