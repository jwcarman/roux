# who's tables, from the scripts who bundles: the contract tests have no migrations of their own
who.initialize-schema=always

# The two sign-in methods the starter brings, with the settings each requires. No security chain of
# the tests' own: who's default chain serves, as in an application that writes none.
who.email-link.link-base-url=http://localhost/signin/link
who.email-link.code-secret=contract-tests-only-code-secret-not-for-production
who.email-link.from=noreply@roux.test
who.passkey.rp-id=localhost
who.passkey.allowed-origins=http://localhost
who.passkey.from=noreply@roux.test

# Sign-in emails go out through Spring Boot's mail sender; the tests send none.
spring.mail.host=localhost
