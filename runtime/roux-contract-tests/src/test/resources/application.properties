# The two sign-in methods the starter brings, with the settings each requires. No security chain of
# the tests' own: who's default chain serves, as in an application that writes none.
who.email-link.link-base-url=http://localhost/signin/link
who.email-link.code-secret=contract-tests-only-code-secret-not-for-production
who.passkey.rp-id=localhost
who.passkey.allowed-origins=http://localhost

# who's emails go out over SMTP (who-email-smtp), from one address; the tests send none.
who.email.from=noreply@roux.test
spring.mail.host=localhost

# migratory runs who's and roux-theme's changelogs; the tests have none of their own, so Spring
# Boot's run of the app's changelog is off. Hibernate checks roux-theme's mapping against its table.
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# The app's name, for the shell and the theme
spring.application.name=roux-contract-tests

# The first owner, which roux-roles makes at startup while no active OWNER exists
roux.owner.email=owner@roux.test
roux.owner.name=Contract Owner

# The roles an invitation may give
roux.roles.invitable=MEMBER
roux.money.currency=USD
