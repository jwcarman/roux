name: CI

on:
  # Keeps the SonarCloud token alive: a token that goes unused for a while expires, and every
  # build after that fails on a credential nobody revoked. Twice a month leaves plenty of margin.
  schedule:
    - cron: '0 9 1,15 * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
# A newer push to a pull request replaces its running build; on main every push is checked to the
# end, so each commit is verified and the badge never shows a cancelled run as failing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Go runtime, fastest check first. Database tests start their own Postgres containers
  # (testcontainers-go), which the runner's Docker provides.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt
      - name: Vet
        run: make vet
      - name: Lint (the Makefile's pinned golangci-lint)
        run: make lint
      - name: Known vulnerabilities in the code it calls
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Test
        run: make test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage.out

  # The Claude Code plugin's checks: every public name is in the guides and the skill, every Go
  # name they write exists, and the skill's recipe, built into a copy of the template, passes the
  # template's checks.
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: template/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Names in the guides and the skill
        run: node plugins/roux/scripts/check-guides.mjs
      - name: The recipe, built into the template
        run: bash plugins/roux/scripts/check-recipe.sh


  # The app template (template/): its Go checks, then its front end's tests and build. (Its export
  # and the starter are tested in the web job; its Playwright suite is not in CI yet.)
  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: template/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Formatting
        run: make fmt
      - name: Vet
        run: make vet
      - name: Lint (the Makefile's pinned golangci-lint)
        run: make lint
      - name: Known vulnerabilities in the code it calls
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Test
        run: make test
      # The template links the roux-web beside it, so roux-web is built first.
      - name: Build roux-web
        working-directory: web
        run: npm ci --ignore-scripts && npm run build -w @jwcarman/roux-web
      - name: Front end install
        working-directory: template/frontend
        run: npm ci --ignore-scripts && npm ci --ignore-scripts --prefix lint-tools
      - name: Front end formatting and lint
        working-directory: template/frontend
        run: npm run format:check && npm run lint
      - name: Front end tests with coverage, then the build
        working-directory: template/frontend
        run: npm run coverage && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-template
          path: |
            template/coverage.out
            template/frontend/coverage/lcov.info

  # The template's container image, run as `make up` runs it (scripts/check-image.sh): built from
  # the Dockerfile, beside Postgres and Mailpit, ready, and sending a sign-in email.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: roux-web's install
        working-directory: web
        run: npm ci --ignore-scripts
      - name: The image, beside Postgres and Mailpit
        run: scripts/check-image.sh

  # The example app, built in rounds to find what roux is missing (examples/roux-the-day/FINDINGS.md).
  roux-the-day:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/roux-the-day
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/roux-the-day/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Formatting
        run: make fmt
      - name: Vet
        run: make vet
      - name: Lint (the Makefile's pinned golangci-lint)
        run: make lint
      - name: Test
        run: make test
      # The app links the roux-web in this repository, so roux-web is built first.
      - name: Build roux-web
        working-directory: web
        run: npm ci --ignore-scripts && npm run build -w @jwcarman/roux-web
      - name: Front end tests with coverage, then the build
        working-directory: examples/roux-the-day/frontend
        run: |
          npm ci --ignore-scripts && npm ci --ignore-scripts --prefix lint-tools
          npm run format:check && npm run lint && npm run surfaces:check
          npm run coverage && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-roux-the-day
          path: |
            examples/roux-the-day/coverage.out
            examples/roux-the-day/frontend/coverage/lcov.info

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: 'lts/*'
      # The installed packages themselves, not only npm's download cache: unpacking them again was most
      # of a minute. A changed lockfile or Node version installs afresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: |
            web/node_modules
            web/*/node_modules
          key: web-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('web/package-lock.json', 'web/lint-tools/package-lock.json') }}
      # The formatter and linter live in their own package (web/lint-tools), outside the workspace.
      - name: Install web dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts && npm ci --ignore-scripts --prefix lint-tools
        working-directory: web
      - name: Check formatting
        run: npm run format:check -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
      - name: Lint
        run: npm run lint -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
      - name: Typecheck
        run: npm run typecheck -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
      # Runs the tests once, with the coverage thresholds.
      - name: Test with coverage
        run: npm run coverage -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
      - name: Build
        run: npm run build -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
      # The template create-roux-app ships: its export, then the packed starter making an app from it.
      - name: Export the app template
        run: bash scripts/export-app-template.test.sh
      - name: The packed starter
        run: bash web/create-roux-app/pack-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: |
            web/roux-web/coverage/lcov.info
            web/create-roux-app/coverage/lcov.info

  # SonarCloud, once every part has passed, with every part's coverage. Pull requests from forks
  # get no secrets, so they skip it rather than fail.
  sonar:
    needs: [go, template, roux-the-day, web]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history, so SonarCloud can attribute new code and blame
          fetch-depth: 0
      # Each artifact keeps its paths below the common root of what was uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-go
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-template
          path: template
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-roux-the-day
          path: examples/roux-the-day
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-web
          path: web
      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
