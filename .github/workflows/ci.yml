name: CI

on:
  # Keeps the SonarCloud token alive: a token that goes unused for a while expires, and every
  # build after that fails on a credential nobody revoked. Twice a month leaves plenty of margin.
  schedule:
    - cron: '0 9 1,15 * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history, so SonarCloud can attribute new code and blame
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven
      # The dojo's Playwright suite (E2eIT) runs on pushes to main only. Its Chromium needs system
      # libraries the runner does not have; the build installs the browser itself.
      - name: Install Chromium system libraries
        if: github.event_name == 'push'
        run: sudo npx -y "playwright@$(node -p "require('./examples/dojo/e2e/package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/, '')")" install-deps chromium
      # roux's modules, then the dojo and the app template: their Java tests, Vitest and, on pushes, E2eIT.
      - run: ./mvnw -B verify ${{ github.event_name != 'push' && '-DskipITs' || '' }}
      - name: Upload the dojo's and the app template's test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dojo-logs
          path: |
            examples/dojo/target/playwright.log
            examples/dojo/target/app.log
            examples/dojo/target/surefire-reports/
            examples/dojo/target/failsafe-reports/
            templates/app/target/playwright.log
            templates/app/target/app.log
            templates/app/target/surefire-reports/
            templates/app/target/failsafe-reports/
          if-no-files-found: ignore
      # Analyses the build above (classes and JaCoCo reports). Pull requests from forks get no
      # secrets, so they skip it rather than fail.
      - name: SonarCloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Fully qualified: this Maven does not resolve the "sonar:" prefix from the project's plugins.
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # The Claude Code plugin: every public roux name is in a guide, and the skill's references are
  # byte-for-byte copies of docs/guides (plugins/roux/scripts/sync-references.sh refreshes them).
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Check the guides and references
        run: node plugins/roux/scripts/check-guides.mjs

  # The app template as jwcarman/roux-app-template gets it at a release: no link to roux's
  # repository left, and its roux.version is roux's own (bumped with it after each release).
  app-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the export script
        run: scripts/export-app-template.test.sh
      - name: Export the template at roux's version
        run: |
          version="$(sed -n 's:^    <version>\(.*\)</version>$:\1:p' pom.xml | head -1)"
          scripts/export-app-template.sh "$version" "$RUNNER_TEMP/roux-app-template"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/lint-tools/package-lock.json
      # The formatter and linter live in their own package (web/lint-tools), outside the workspace.
      - name: Install web dependencies
        run: npm ci --ignore-scripts
        working-directory: web
      - name: Install lint tools
        run: npm ci --ignore-scripts
        working-directory: web/lint-tools
      - name: Check formatting
        run: npm run format:check -w @jwcarman/roux-web
        working-directory: web
      - name: Lint
        run: npm run lint -w @jwcarman/roux-web
        working-directory: web
      - name: Typecheck
        run: npm run typecheck -w @jwcarman/roux-web
        working-directory: web
      # Runs the tests once, with the coverage thresholds.
      - name: Test with coverage
        run: npm run coverage -w @jwcarman/roux-web
        working-directory: web
      - name: Build
        run: npm run build -w @jwcarman/roux-web
        working-directory: web
