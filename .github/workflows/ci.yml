name: CI

on:
  # Keeps the SonarCloud token alive: a token that goes unused for a while expires, and every
  # build after that fails on a credential nobody revoked. Twice a month leaves plenty of margin.
  schedule:
    - cron: '0 9 1,15 * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Go runtime, fastest check first. Database tests start their own Postgres containers
  # (testcontainers-go), which the runner's Docker provides.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history, so SonarCloud can attribute new code and blame
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt
      - name: Vet
        run: make vet
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test
        run: make test
      # Reads the coverage the tests wrote (coverage.out). Pull requests from forks get no
      # secrets, so they skip it rather than fail.
      - name: SonarCloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The Claude Code plugin: every public roux name is in a guide and in the skill's references,
  # every roux import a reference shows exists, and the skill's index gives each reference's size.
  # (The recipe check, which built a Java app, returns with the Go template.)
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Check the guides and references
        run: node plugins/roux/scripts/check-guides.mjs

  # The app template as create-roux-app ships it: the export leaves no link to roux's repository and
  # follows roux's version (bumped with it after each release), and the packed starter makes an app
  # carrying its own names.
  app-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test the export script
        run: scripts/export-app-template.test.sh
      - name: Install web dependencies
        run: npm ci --ignore-scripts
        working-directory: web
      - name: Test the packed starter
        run: web/create-roux-app/pack-test.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/lint-tools/package-lock.json
      # The formatter and linter live in their own package (web/lint-tools), outside the workspace.
      - name: Install web dependencies
        run: npm ci --ignore-scripts
        working-directory: web
      - name: Install lint tools
        run: npm ci --ignore-scripts
        working-directory: web/lint-tools
      - name: Check formatting
        run: npm run format:check -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
      - name: Lint
        run: npm run lint -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
      - name: Typecheck
        run: npm run typecheck -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
      # Runs the tests once, with the coverage thresholds.
      - name: Test with coverage
        run: npm run coverage -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
      - name: Build
        run: npm run build -w @jwcarman/roux-web -w @jwcarman/create-roux-app
        working-directory: web
