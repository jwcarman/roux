name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven
      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      # The formatter and linter live in their own package (web/lint-tools), outside the workspace.
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install lint tools
        run: npm ci
        working-directory: web/lint-tools
      - name: Check formatting
        run: npm run format:check -w @jwcarman/roux-web
        working-directory: web
      - name: Lint
        run: npm run lint -w @jwcarman/roux-web
        working-directory: web
      - name: Typecheck
        run: npm run typecheck -w @jwcarman/roux-web
        working-directory: web
      - name: Test
        run: npm test -w @jwcarman/roux-web
        working-directory: web
      - name: Coverage
        run: npm run coverage -w @jwcarman/roux-web
        working-directory: web
      - name: Build
        run: npm run build -w @jwcarman/roux-web
        working-directory: web

  mutation:
    # Slow, so only on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Mutation testing (Java)
        run: ./mvnw -B -Ppit verify
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Mutation testing (web)
        run: npm run mutate -w @jwcarman/roux-web
        working-directory: web
