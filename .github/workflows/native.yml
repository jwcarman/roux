name: Native

# The app template as a native image: its Java tests compiled and run native (nativeTest), and
# the binary under the Playwright suite (native-e2e). Each takes several minutes and a lot of
# memory, so this runs nightly and on demand rather than on every push.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      # The template builds against this commit's roux, not a published one.
      - name: Install roux
        run: ./mvnw -B install -DskipTests
      - name: Install Chromium system libraries
        run: sudo npx -y "playwright@$(node -p "require('./templates/app/e2e/package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/, '')")" install-deps chromium
      - name: Native tests
        run: ../../mvnw -B -PnativeTest test
        working-directory: templates/app
      # Builds the binary, then runs the same Playwright suite against it.
      - name: Native end-to-end
        run: ../../mvnw -B -Pnative-e2e verify
        working-directory: templates/app
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-logs
          path: |
            templates/app/target/playwright.log
            templates/app/target/app.log
            templates/app/target/native-test-reports/
            templates/app/target/failsafe-reports/
          if-no-files-found: ignore
