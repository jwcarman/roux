name: Mutation

# Incremental mutation testing (Stryker; the Go runtime has none yet). Its own workflow, so it never holds up CI.
on:
  push:
    branches: [ "main" ]
  # A full run with no history, twice a month: incremental runs can miss a mutant whose
  # result changed because of code elsewhere.
  schedule:
    - cron: '0 10 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Caches are immutable, so each run saves under its own commit and restores the newest
      # earlier one by prefix. The scheduled full run starts from nothing.
      - name: Restore mutation history
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-history
          key: mutation-history-${{ github.sha }}
          restore-keys: mutation-history-
      - name: Install web dependencies
        run: npm ci --ignore-scripts
        working-directory: web
      - name: Mutation testing (web)
        run: npm run mutate -w @jwcarman/roux-web
        working-directory: web
      - name: Mutation testing (starter)
        run: npm run mutate -w @jwcarman/create-roux-app
        working-directory: web
      # Saved after a failed run too (a survivor fails it): the mutants that did run keep their
      # results, so the fix's run retests only what changed instead of the whole package.
      - name: Save mutation history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-history
          key: mutation-history-${{ github.sha }}-${{ github.run_attempt }}
