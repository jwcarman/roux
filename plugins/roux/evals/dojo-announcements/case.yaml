schema_version: "1.1"
name: dojo-announcements
expected_outcome: |
  On a grown roux app (the dojo, a dozen features): The owner posts announcements (a title, required and at most 80 characters, and an optional
  message of at most 2000). Every signed-in user reads them on an Announcements page, newest first,
  paged by the server 20 at a time and searched by title on the server; anyone but the owner is
  refused (403) when posting.
  The full build and roux's way are also checked by script after the run (check-roux-way.sh on the
  run's directory). The graders named NN-roux-* judge roux's way (roux-web's client and forms,
  roux's rule messages and exceptions, no roux internals).
context:
  scaffold_script: place-dojo.sh
