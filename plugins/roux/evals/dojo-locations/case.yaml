schema_version: "1.1"
name: dojo-locations
expected_outcome: |
  On a grown roux app (the dojo, a dozen features): The owner keeps the school's training locations on a Locations page: a table of the locations
  (name and kind) and a dialog to add and edit one. A name is required, at most 40 characters and
  unique; a duplicate is refused by the server as an error on the name field and shown under it in
  the dialog. Anyone but the owner is refused (403) by the locations API.
  The full build and roux's way are also checked by script after the run (check-roux-way.sh on the
  run's directory). The graders named NN-roux-* judge roux's way (roux-web's client and forms,
  roux's rule messages and exceptions, no roux internals).
context:
  scaffold_script: place-dojo.sh
