schema_version: "1.1"
name: dojo-events
expected_outcome: |
  On a grown roux app (the dojo, a dozen features): The owner keeps the school's events on an Events page: a table, soonest first, and a dialog to
  add and edit one. A name is required and at most 60 characters; the start and end dates are
  required, and an end date that is not after the start is refused by the server as an error on the
  end date reading "Must be after the start date", shown under that field in the form. Anyone but
  the owner is refused (403) by the events API. The table comes from a new changeset.
  The full build and roux's way are also checked by script after the run (check-roux-way.sh on the
  run's directory). The graders named NN-roux-* judge roux's way (roux-web's client and forms,
  roux's rule messages and exceptions, no roux internals).
context:
  scaffold_script: place-dojo.sh
