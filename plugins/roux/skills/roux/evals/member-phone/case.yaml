schema_version: "1.1"
name: member-phone
expected_outcome: |
  A member can save an optional phone number of at most 30 characters on their own profile; one
  that is too long is refused by the server and the error shows under the phone field. The member
  directory shows each member's phone. The build and tests pass. The graders named NN-roux-* judge
  roux's way (roux-web's client and forms, roux's rule messages and exceptions, no roux internals)
  and apply to the roux arms only; the plain-stack arm is scored on the others.
context:
  scaffold_script: place-dojo.sh
