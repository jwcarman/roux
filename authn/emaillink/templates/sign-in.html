{{define "body" -}}
<p style="margin:0 0 16px 0;">Use the button to sign in to <strong>{{.App}}</strong>.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;"><tr><td style="border-radius:6px;background-color:{{.BrandColor}};"><a href="{{.Link}}" style="display:inline-block;padding:12px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:6px;">Sign in to {{.App}}</a></td></tr></table>
<p style="margin:0 0 16px 0;">Or enter this code:</p>
<p style="margin:0 0 24px 0;padding:16px;background-color:#f4f4f5;border-radius:6px;text-align:center;font-family:'Courier New',Courier,monospace;font-size:28px;line-height:36px;font-weight:bold;letter-spacing:4px;color:#18181b;">{{.Code}}</p>
<p style="margin:0 0 16px 0;color:#52525b;font-size:14px;line-height:20px;">The link and the code expire in {{.ExpiresIn}} and work once.</p>
<p style="margin:0 0 16px 0;color:#52525b;font-size:14px;line-height:20px;">If you didn&#39;t ask to sign in, ignore this email. Never share this code with anyone.</p>
{{- end}}
