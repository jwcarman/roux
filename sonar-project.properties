sonar.organization=jwcarman
sonar.projectKey=jwcarman_roux
sonar.host.url=https://sonarcloud.io

# SonarCloud analyzes the whole repository. Left out: the Claude Code plugin (rewritten for the Go
# runtime), dependencies and build output, and the migrations' SQL, which it would judge as Oracle
# PL/SQL rather than Postgres.
sonar.exclusions=plugins/**,**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,**/migrations/*.sql

# Coverage comes from each part's own tests, collected by CI's sonar job:
#   coverage.out                     the Go runtime (make test)
#   template/coverage.out            the template's Go (make test in template/)
#   */coverage/lcov.info             roux-web, create-roux-app, the template's front end (npm run coverage)
sonar.go.coverage.reportPaths=coverage.out,template/coverage.out
sonar.javascript.lcov.reportPaths=web/roux-web/coverage/lcov.info,web/create-roux-app/coverage/lcov.info,template/frontend/coverage/lcov.info

# Not counted toward coverage: tests and their helpers, generated files, and what each package's
# own coverage settings leave out (barrel index files, create-roux-app's bin.ts), plus build and
# tool configuration.
sonar.coverage.exclusions=\
  **/*_test.go,**/*.test.ts,**/*.test.tsx,\
  pgtest/**,**/*test/*.go,\
  web/roux-web/src/testing/**,template/frontend/src/testing/**,\
  web/roux-web/src/**/index.ts,web/create-roux-app/src/bin.ts,\
  **/*.gen.ts,\
  template/e2e/**,scripts/**,web/lint-tools/**,\
  **/vite.config.ts,**/*.config.mjs,**/*.config.js
