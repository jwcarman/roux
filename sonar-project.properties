sonar.organization=jwcarman
sonar.projectKey=jwcarman_roux
sonar.host.url=https://sonarcloud.io

# The Go runtime (the Java runtime is being replaced; the npm packages have their own gates)
sonar.sources=.
sonar.inclusions=**/*.go
sonar.exclusions=**/*_test.go,**/node_modules/**,runtime/**,examples/**,templates/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/node_modules/**,runtime/**,examples/**,templates/**
sonar.go.coverage.reportPaths=coverage.out
