services:
  - name: postgres
    image: postgres:16
    env:
      POSTGRES_USER: noir
      POSTGRES_PASSWORD: noir
      POSTGRES_DB: noir
    ready: [pg_isready, -h, 127.0.0.1, -U, noir]
    expose:
      NOIR_TEST_DATABASE_URL: jdbc:postgresql://postgres:5432/noir
      NOIR_TEST_DATABASE_USERNAME: noir
      NOIR_TEST_DATABASE_PASSWORD: noir
  - name: mailpit
    image: axllent/mailpit:v1.33.1
    ready: [/mailpit, readyz]
    expose:
      NOIR_TEST_MAIL_SMTP_HOST: mailpit
      NOIR_TEST_MAIL_SMTP_PORT: "1025"
      NOIR_TEST_MAIL_API_URL: http://mailpit:8025
typescript:
  root: frontend
