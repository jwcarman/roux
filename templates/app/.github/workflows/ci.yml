name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven
      # Playwright's Chromium needs system libraries the runner does not have. The build installs
      # the browser itself (e2e-npm-ci, then playwright install chromium); this adds its libraries.
      - name: Install Chromium system libraries
        run: sudo npx -y "playwright@$(node -p "require('./e2e/package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/, '')")" install-deps chromium
      # Unit and slice tests, the frontend's Vitest, and the Playwright suite (E2eIT) against the
      # jar, with PostgreSQL and Mailpit in Testcontainers.
      - name: Verify
        run: ./mvnw -B verify
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-logs
          path: |
            target/playwright.log
            target/app.log
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
